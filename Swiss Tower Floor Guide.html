<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss Tower Floor Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
:root{--p:hsl(5,70%,38%);--op:#fff;--pc:hsl(5,100%,90%);--opc:hsl(5,80%,12%);--sc:hsl(5,30%,88%);--osc:hsl(5,30%,14%);--tc:hsl(65,70%,88%);--otc:hsl(65,70%,14%);--s:hsl(5,30%,98%);--sl:hsl(5,28%,96%);--sm:hsl(5,22%,93%);--sh:hsl(5,20%,90%);--os:hsl(5,15%,10%);--ov:hsl(5,10%,32%);--ol:hsl(5,6%,48%);--olv:hsl(5,12%,80%);--er:#ba1a1a;--erc:#ffdad6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:hsl(5,85%,80%);--op:hsl(5,70%,18%);--pc:hsl(5,55%,28%);--opc:hsl(5,90%,90%);--sc:hsl(5,18%,26%);--osc:hsl(5,25%,88%);--tc:hsl(65,40%,27%);--otc:hsl(65,70%,88%);--s:hsl(5,14%,8%);--sl:hsl(5,12%,11%);--sm:hsl(5,12%,14%);--sh:hsl(5,11%,18%);--os:hsl(5,14%,90%);--ov:hsl(5,10%,76%);--ol:hsl(5,8%,56%);--olv:hsl(5,8%,28%);--er:#ffb4ab;--erc:#93000a;color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--s);color:var(--os);font:400 16px/1.5 'Roboto Flex',Roboto,system-ui,sans-serif;transition:background .3s}
button,input,select{font-family:inherit}button{cursor:pointer}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom,0px));padding:12px 8px env(safe-area-inset-bottom,0px);background:var(--sm);display:flex;z-index:30}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ov);font:500 12px 'Roboto Flex'}
nav .pl{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s}
nav .on{color:var(--os)}nav .on .pl{background:var(--sc);color:var(--osc)}
main{max-width:760px;margin:0 auto;padding:0 16px calc(170px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 12px}
.bar h1{font:400 32px/40px 'Roboto Flex';margin:0}.bar p{margin:0;color:var(--ov);font-size:14px}
.ib{width:48px;height:48px;border-radius:24px;border:0;background:none;color:var(--ov);display:grid;place-items:center}.ib[aria-pressed="true"]{background:var(--sc);color:var(--osc)}
.btn{height:40px;padding:0 24px;border-radius:20px;border:0;font:500 14px 'Roboto Flex';display:inline-flex;align-items:center;gap:8px}
.btn svg.i{width:18px;height:18px}
.fill{background:var(--p);color:var(--op)}.tonal{background:var(--sc);color:var(--osc)}.text{background:none;color:var(--p);padding:0 12px}.out{background:none;border:1px solid var(--ol);color:var(--p)}.err{color:var(--er)}
.card{background:var(--sm);border-radius:28px;padding:20px;margin-bottom:12px}
.hero{background:var(--pc);color:var(--opc);padding:24px;position:relative;overflow:hidden}
.hero .lb{font:500 14px 'Roboto Flex';opacity:.8}
.dm{font:300 clamp(72px,24vw,112px)/1 'Roboto Flex';letter-spacing:-4px;margin:4px 0 8px;font-variation-settings:'opsz' 144}
.hero h2{font:500 24px/32px 'Roboto Flex';margin:0}.hero p{margin:4px 0 20px;opacity:.85}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--p);opacity:.12}
.bern{display:flex;gap:12px;align-items:center}.bern .av{width:64px;height:64px;border-radius:22px;background:var(--tc);padding:4px;flex:none}
.bern svg{width:100%;height:100%;display:block}.bern p{margin:0;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--olv);background:none;color:var(--ov);font:500 14px 'Roboto Flex'}
.chip:hover{background:var(--sh)}
h3{font:500 16px 'Roboto Flex';margin:20px 4px 10px;color:var(--ov);display:flex;justify-content:space-between;align-items:center}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tmc{border:0;border-radius:20px;background:var(--tc);color:var(--otc);padding:14px;text-align:left;font:500 16px 'Roboto Flex'}
.tmc small{display:block;font:400 12px 'Roboto Flex';opacity:.8;margin-top:2px}
.li{display:flex;gap:14px;align-items:center;background:var(--sl);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.li .tm{font:400 22px 'Roboto Flex';min-width:64px}.li .tx{flex:1;min-width:0}.li b{display:block;font-weight:500}.li span.s{font-size:14px;color:var(--ov)}
.li.past{opacity:.6}.st{font:500 11px 'Roboto Flex';border-radius:8px;padding:2px 8px;background:var(--sc);color:var(--osc);margin-left:6px}
.view{display:none}.view.on{display:block}
.srch{display:flex;align-items:center;gap:12px;background:var(--sh);border-radius:28px;height:56px;padding:0 20px;margin-bottom:12px}
.srch input{flex:1;border:0;background:none;font:400 16px 'Roboto Flex';color:var(--os);outline:none;height:100%}
.seg{display:flex}.seg button{flex:1;height:40px;border:1px solid var(--ol);background:none;color:var(--os);font:500 14px 'Roboto Flex';margin-left:-1px}
.seg button:first-child{border-radius:20px 0 0 20px;margin:0}.seg button:last-child{border-radius:0 20px 20px 0}.seg .on{background:var(--sc);color:var(--osc)}
svg.plan{width:100%;height:auto;display:block}svg.plan.pl2{outline:3px dashed var(--p);outline-offset:-3px;cursor:crosshair}.rm{fill:var(--sh);cursor:pointer;transition:fill .2s}.rm.team{fill:var(--tc)}.rm.meet{fill:var(--sc)}.rm.sel{fill:var(--p)}
.rl{font:500 11px 'Roboto Flex';fill:var(--os);text-anchor:middle;pointer-events:none}.rm.sel+.rl{fill:var(--op)}
.co{fill:var(--sl)}.rt{fill:none;stroke:var(--p);stroke-width:4;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-28}}.you{fill:var(--p);stroke:var(--s);stroke-width:3}.pu{fill:var(--p);opacity:.3;animation:pl 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{from{transform:scale(.6);opacity:.5}to{transform:scale(2.6);opacity:0}}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ov)}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
ol.stp{margin:10px 0 0;padding-left:22px}ol.stp li{margin:6px 0}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--sh);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--ol);transition:.2s}
.sw[aria-checked="true"]{background:var(--p);border-color:var(--p)}.sw[aria-checked="true"]::after{left:24px;width:24px;height:24px;margin-top:-12px;background:var(--op)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}.sr small{display:block;color:var(--ov)}
.sat{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.sat button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.sat button[aria-pressed="true"]{border-color:var(--os)}
#qr{width:fit-content;background:#fff;padding:12px;border-radius:16px;margin:12px 0}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--pc);color:var(--opc);display:flex;gap:12px;align-items:center;border:0;font:500 16px 'Roboto Flex';box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:25}
.scr{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}.scr.on{display:flex}
.sheet{background:var(--sl);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .28s cubic-bezier(.2,0,0,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}.hd{width:32px;height:4px;border-radius:2px;background:var(--olv);margin:0 auto 16px}
.sheet h2{font:400 24px/32px 'Roboto Flex';margin:0 0 4px}.sheet .sub{color:var(--ov);margin:0 0 16px}.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:20px}
.tf{position:relative;margin:20px 0 4px}.tf input,.tf select{width:100%;height:56px;border:1px solid var(--ol);border-radius:4px;background:none;color:var(--os);font:400 16px 'Roboto Flex';padding:0 16px}
.tf select option{color:#111}.tf input:focus,.tf select:focus{border:2px solid var(--p);outline:none;padding:0 15px}
.tf label{position:absolute;left:12px;top:-9px;padding:0 4px;background:var(--sl);color:var(--ov);font-size:12px;pointer-events:none}
.snack{position:fixed;left:16px;right:16px;max-width:520px;margin:0 auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--os);color:var(--s);border-radius:8px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:50}
.snack.on{display:flex}.snack button{background:none;border:0;color:var(--pc);font:500 14px 'Roboto Flex'}
#wel{position:fixed;inset:0;z-index:60;background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#wel .big{width:180px;height:180px;border-radius:56px;background:var(--tc);padding:12px}#wel .big svg{width:100%;height:100%}
#wel h1{font:400 36px/44px 'Roboto Flex';margin:8px 0 0;max-width:360px}#wel p{color:var(--ov);margin:0 0 8px;max-width:340px}
#wel .seg{width:200px}#wel .btn{width:100%;max-width:320px;justify-content:center;height:48px;border-radius:24px}
.off{display:none!important}
@media (min-width:720px){nav{top:0;bottom:auto;right:auto;width:88px;height:100vh;flex-direction:column;justify-content:flex-start;gap:14px;padding:56px 0 16px;background:var(--s)}nav button{flex:none}
main{padding-left:104px;padding-bottom:120px;margin:0 auto;max-width:860px}.fab{bottom:32px;right:40px}.snack{bottom:32px}.scr{align-items:center}.sheet{border-radius:28px}}
button:focus-visible,.rm:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
